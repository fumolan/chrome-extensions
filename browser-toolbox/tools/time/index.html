<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>当前时间 - 浏览器工具箱</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    /* 本工具专属：仿 time.is 的大时钟 + 世界时钟（SVG 指针钟 + 世界地图背景） */
    .clock-card { text-align: center; padding: 28px 14px 14px; }
    .clock {
      font: 600 64px/1.1 Consolas, "Segoe UI", monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
    }
    .clock .sec { color: var(--accent); }
    .clock .ampm { font-size: 18px; color: var(--muted); font-weight: 400; margin-left: 8px; }
    .date-line { margin-top: 12px; font-size: 17px; }
    .lunar-line { margin-top: 4px; font-size: 13px; color: var(--muted); }
    .kv .v.grow { flex: 1; }
    .kv button { margin-left: auto; }

    /* 世界时钟：地图选城 */
    .map-block {
      position: relative;
      aspect-ratio: 1000 / 403;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      overflow: hidden;
    }
    .map-bg {
      position: absolute;
      inset: 0;
      background-color: var(--fg);
      opacity: 0.1;
      -webkit-mask: url('assets/world-map.svg') center / contain no-repeat;
      mask: url('assets/world-map.svg') center / contain no-repeat;
      pointer-events: none;
    }
    #cityMap { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
    #cityMap .pt { fill: color-mix(in srgb, var(--fg) 55%, transparent); }
    #cityMap .pt.added { fill: var(--accent); }
    #cityMap .pt.near { fill: var(--accent); stroke: var(--accent); stroke-width: 1; }
    .map-tip {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - 10px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .cities {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }
    .city-card {
      position: relative;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 6px 8px;
      text-align: center;
      min-width: 0;
    }
    .city-card .rm {
      position: absolute; top: 2px; right: 4px;
      border: none; background: none; color: var(--muted);
      cursor: pointer; font-size: 14px; line-height: 1; padding: 3px 5px;
      display: none;
    }
    .city-card:hover .rm { display: block; }
    .city-card .rm:hover { color: var(--danger); }
    .analog { width: 76px; height: 76px; display: block; margin: 0 auto; }
    .analog .face { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .analog .tick { stroke: var(--muted); stroke-width: 1.5; }
    .analog .tick.major { stroke: var(--fg); stroke-width: 2; }
    .analog .h { stroke: var(--fg); stroke-width: 4.5; stroke-linecap: round; }
    .analog .m { stroke: var(--fg); stroke-width: 2.8; stroke-linecap: round; }
    .analog .s { stroke: var(--accent); stroke-width: 1.4; stroke-linecap: round; }
    .analog .pin { fill: var(--accent); }
    .city-name { font-size: 13px; font-weight: 600; margin-top: 6px; }
    .city-time { font: 600 19px/1.3 Consolas, monospace; font-variant-numeric: tabular-nums; }
    .city-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .city-sub .badge { color: var(--accent); margin-left: 4px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../../popup/popup.html">← 工具箱</a>
    <h1>⏰ 当前时间</h1>
    <span class="ver-tag" id="verTag"></span>
    <button id="copyIsoBtn">复制 ISO 时间</button>
  </div>

  <div class="card clock-card">
    <div class="clock" id="clock">
      <span id="hh">00</span>:<span id="mi">00</span>:<span class="sec" id="ss">00</span><span class="ampm" id="ampm"></span>
    </div>
    <div class="date-line" id="dateLine"></div>
    <div class="lunar-line" id="lunarLine"></div>
    <div class="opts" style="justify-content:center">
      <label><input type="checkbox" id="ampmToggle"> 12 小时制</label>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>世界时钟</h2>
      <span id="mapMsg" class="muted">点地图：加入离点击点最近的城市</span>
    </div>
    <div class="map-block">
      <div class="map-bg" aria-hidden="true"></div>
      <svg id="cityMap" viewBox="0 0 1000 403" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="mapTip" class="map-tip" hidden></div>
    </div>
    <div class="muted" style="margin-top:8px">地图标注约 1000 个城市点（覆盖 240+ 国家/地区，按人口选取）。点击任意位置加入最近城市；亮色点 = 已加入；悬停看城市名与当地时间。</div>
    <div class="cities" id="cityGrid" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>时区</h2>
      <span class="muted">读自本机系统设置</span>
    </div>
    <div id="tzCard"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Unix 时间戳</h2>
      <span class="muted">实时更新</span>
    </div>
    <div id="tsCard"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>常用格式</h2>
      <span class="muted">行尾「复制」按钮</span>
    </div>
    <div id="fmtCard"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>历法</h2>
      <span class="muted">农历数据支持 1900–2049 年</span>
    </div>
    <div id="calCard"></div>
  </div>

  <p class="muted">本工具直接读取本机系统时间，纯本地展示、不联网校时（time.is 式的原子钟对时需要联网，工具箱坚持无网络请求）。城市时间用浏览器内置时区数据库换算；若怀疑系统时间不准，可与手机或 time.is 对照。</p>
</div>
<script src="../diag.js"></script>
<script src="../registry.js"></script>
<script src="assets/cities.js"></script>
<script src="index.js"></script>
</body>
</html>
